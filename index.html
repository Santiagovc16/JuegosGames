<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Consolas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --ps-color: #0f32ce;
            --xbox-color: #03852e;
            --nintendo-color: #f72216;
            --neon-effect: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #0a081f 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cyber-grid {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            animation: gridScan 8s linear infinite;
        }

        header {
            position: relative;
            padding: 4rem 0;
            background: linear-gradient(45deg, rgba(0,0,0,0.5), transparent);
            clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);
            margin-bottom: 5rem;
            overflow: hidden;
            z-index: 1;
        }

        header h1 {
            font-size: 4rem;
            text-align: center;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            background: linear-gradient(45deg, var(--ps-color), var(--xbox-color), var(--nintendo-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: titleFloat 3s ease-in-out infinite;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 4rem;
            padding: 2rem;
            max-width: 1500px;
            margin: 0 auto;
            perspective: 2000px;
            position: relative;
            z-index: 1;
        }

        .catalog-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2.5rem;
            font-size: 2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.6s var(--neon-effect);
            transform-style: preserve-3d;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .catalog-btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, var(--btn-color-1), var(--btn-color-2));
            border-radius: inherit;
            filter: blur(25px);
            opacity: 0.5;
            transition: opacity 0.4s;
            z-index: -1;
        }

        .catalog-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, 
                rgba(255,255,255,0.1) 0%,
                rgba(255,255,255,0) 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .catalog-btn:hover {
            transform: translateY(-10px) rotateX(15deg) rotateY(10deg) scale(1.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .catalog-btn:hover::before {
            opacity: 0.8;
        }

        .catalog-btn:hover::after {
            opacity: 1;
        }

        .catalog-btn i {
            font-size: 2.5rem;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.4s, color 0.4s;
            color: white;
        }

        .catalog-btn:hover i {
            transform: scale(1.2) rotate(15deg);
        }

        .ps-btn {
            --btn-color-1: #029be8;
            --btn-color-2: #91e1ea;
        }
        .ps-btn span {
            color: var(--ps-color);
        }

        .xbox-btn {
            --btn-color-1: #04461a;
            --btn-color-2: #30a153;
        }
        .xbox-btn span {
            color: var(--xbox-color);
        }

        .nintendo-btn {
            --btn-color-1: #ff4136;
            --btn-color-2: #d62c2c;
        }
        .nintendo-btn span {
            color: var(--nintendo-color);
        }

        footer {
            margin-top: 8rem;
            padding: 3rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            text-align: center;
            position: relative;
            z-index: 1;
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        @keyframes gridScan {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5rem;
            }
            
            .button-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .catalog-btn {
                font-size: 1.6rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    
    <header>
        <h1>Next-Gen Consolas</h1>
    </header>

    <main>
        <div class="button-container">
            <a href="playstation.html" class="catalog-btn ps-btn">
                <i class="fab fa-playstation"></i>
                <span>PlayStation 5 - 4</span>
            </a>
            <a href="xbox-catalogo.html" class="catalog-btn xbox-btn">
                <i class="fab fa-xbox"></i>
                <span>Xbox Series X - S</span>
            </a>
            <a href="nintendo-switch-catalogo.html" class="catalog-btn nintendo-btn">
                <i class="fas fa-gamepad"></i>
                <span>Nintendo Switch</span>
            </a>
        </div>
    </main>

    <footer>
        <p>© 2024 Next-Gen Universe - Todos los derechos reservados</p>
    </footer>

    <script>
        // Cambia el color del ícono al hacer hover en cada botón
        document.querySelectorAll('.catalog-btn').forEach(btn => {
            const icon = btn.querySelector('i'); // Selecciona el ícono dentro del botón
            
            btn.addEventListener('mouseenter', () => {
                if (btn.classList.contains('ps-btn')) {
                    icon.style.color = 'var(--ps-color)';
                } else if (btn.classList.contains('xbox-btn')) {
                    icon.style.color = 'var(--xbox-color)';
                } else if (btn.classList.contains('nintendo-btn')) {
                    icon.style.color = 'var(--nintendo-color)';
                }
            });

            btn.addEventListener('mouseleave', () => {
                icon.style.color = 'white'; // Restablece el color a blanco
            });
        });
    </script>
</body>
</html>
