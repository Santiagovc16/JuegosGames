<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Juegos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* El estilo para el body, header, y footer es el mismo */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #141e30, #243b55);
            color: white;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, #ff512f, #dd2476);
            color: white;
            text-align: center;
            padding: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        .game {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        .game img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transition: opacity 0.3s;
        }

        .game:hover img {
            opacity: 0.85;
        }

        footer {
            background: linear-gradient(to right, #ff512f, #dd2476);
            color: white;
            text-align: center;
            padding: 1rem 0;
            margin-top: 2rem;
        }

        footer p {
            font-size: 1rem;
            margin: 0;
        }

        /* Estilos para el modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            position: relative;
            margin: auto;
            top: 10%;
            width: 80%;
            max-width: 1000px;
        }

        .modal img {
    width: 100%;
    height: auto;
    max-height: 80vh; /* Limita la altura máxima de la imagen para que no sea más grande que la pantalla */
    object-fit: contain; /* Asegura que la imagen se ajuste sin distorsionarse ni recortarse */
}


        .close {
            position: absolute;
            top: 10px;
            right: 25px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Galería de Juegos PS5 y PS4</h1>
    </header>
    <main>
        <section class="game-list">
            <div class="game">
                <img src="images/juego1.jpg" alt="Juego 1" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego2.jpg" alt="Juego 2" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego3.jpg" alt="Juego 3" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego4.jpg" alt="Juego 4" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego5.jpg" alt="Juego 5" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego6.jpg" alt="Juego 6" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego7.jpg" alt="Juego 7" class="game-img">
            </div>
            <div class="game">
                <img src="images/juego8.jpg" alt="Juego 8" class="game-img">
            </div>
        </section>
    </main>
    
    <!-- Modal para mostrar imagen en grande -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modal-img" src="" alt="Imagen del Juego">
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Tu Nombre</p>
    </footer>

    <script>
        // Función para abrir el modal y mostrar la imagen grande
        const modal = document.getElementById("myModal");
        const modalImg = document.getElementById("modal-img");
        const closeBtn = document.querySelector(".close");
        const images = document.querySelectorAll(".game-img");

        images.forEach(image => {
            image.addEventListener("click", () => {
                modal.style.display = "block";
                modalImg.src = image.src;  // Asigna la fuente de la imagen clickeada al modal
            });
        });

        // Cerrar el modal al hacer clic en la X
        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        // Cerrar el modal si el usuario hace clic fuera de la imagen
        window.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>
</body>
</html>
