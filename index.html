<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo  de Juegos Playstation 5 Playstation 4 </title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }

        .game-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        .game {
            width: 90%;
            max-width: 800px;
        }

        .game img {
            width: 100%;
            height: 90vh;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catalogo  de Juegos Playstation 5, Playstation 4
            Xbox Nintendo switch  </h1>
    </header>
    <main>
        <section class="game-list">
            <div class="game">
                <img src="images/juego1.jpg" alt="Juego 1">
            </div>
            <div class="game">
                <img src="images/juego2.jpg" alt="Juego 2">
            </div>
            <div class="game">
                <img src="images/juego3.jpg" alt="Juego 3">
            </div>
            <div class="game">
                <img src="images/juego4.jpg" alt="Juego 4">
            </div>
            <div class="game">
                <img src="images/juego5.jpg" alt="Juego 5">
            </div>
            <div class="game">
                <img src="images/juego6.jpg" alt="Juego 6">
            </div>
            <div class="game">
                <img src="images/juego7.jpg" alt="Juego 7">
            </div>
            <div class="game">
                <img src="images/juego8.jpg" alt="Juego 8">
            </div>
        </section>
    </main>
    <footer>
        <p>Gamer Edges</p>
    </footer>
</body>
</html>
