<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Nintendo Switch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #1e1f29, #2a2b3d);
            color: #f5f5f5;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, #ff1e56, #ffac41);
            color: #ffffff;
            text-align: center;
            padding: 2.5rem 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
            border-bottom: 4px solid #0f0c29;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffdf6c;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 3rem;
        }

        .game {
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s, box-shadow 0.4s;
            background: linear-gradient(to top, #0f2027, #203a43, #2c5364);
        }

        .game:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 1);
        }

        .game img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            transition: opacity 0.3s, transform 0.3s;
            cursor: pointer;
        }

        .game:hover img {
            opacity: 0.9;
            transform: scale(1.05);
        }

        footer {
            background: linear-gradient(to right, #000428, #004e92);
            color: #f5f5f5;
            text-align: center;
            padding: 1.5rem 0;
            margin-top: 3rem;
            font-size: 1.1rem;
            box-shadow: 0 -6px 12px rgba(0, 0, 0, 0.7);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 50%;
            height: 90%;
            max-width: 1200px;
            max-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 25px;
            color: #ffdf6c;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }

        .close:hover {
            color: #ff1e56;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Juegos Nintendo Switch</h1>
    </header>
    <main>
        <section class="game-list">
            <div class="game">
                <img src="images3/juego1.jpg" alt="Juego Nintendo 1" class="game-img">
            </div>
            <div class="game">
                <img src="images3/juego2.jpg" alt="Juego Nintendo 2" class="game-img">
            </div>
            <div class="game">
                <img src="images3/juego3.jpg" alt="Juego Nintendo 3" class="game-img">
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modal-img" src="images3/juego1.jpg" alt="Imagen del juego seleccionado">
        </div>
    </div>

    <footer>
        <p>Gamer Edges - Nintendo Switch</p>
    </footer>

    <script>
        // Variables del modal
        const modal = document.getElementById("myModal");
        const modalImg = document.getElementById("modal-img");
        const closeBtn = document.querySelector(".close");
        const images = document.querySelectorAll(".game-img");

        // Mostrar el modal con juego1.jpg al cargar la página
        modal.style.display = "flex";
        modalImg.src = "images3/juego1.jpg"; // Imagen predeterminada al cargar la página

        // Abrir el modal al hacer clic en una imagen
        images.forEach(image => {
            image.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = image.src; // Mostrar la imagen seleccionada en el modal
            });
        });

        // Cerrar el modal al hacer clic en el botón "X"
        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        // Cerrar el modal al hacer clic fuera de la imagen
        modal.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>
</body>
</html>
