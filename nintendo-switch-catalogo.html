<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nintendo Cyberverse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --main-red: #e60012;
      --neon-yellow: #ffdf6c;
      --hologram-blue: #00f7ff;
      --bg-dark: #0a081f;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #1a1a2e 0%, var(--bg-dark) 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .cyber-grid {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(230, 0, 18, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 0, 18, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      animation: gridScan 10s linear infinite;
    }

    /* Efecto de partículas (sin librería) */
    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      padding: 6rem 0;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      margin-bottom: 5rem;
      overflow: hidden;
      z-index: 1;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, var(--main-red), transparent 50%, var(--hologram-blue));
      opacity: 0.1;
      animation: hologram 8s infinite linear;
    }

    header h1 {
      font-size: 4.5rem;
      text-align: center;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.8rem;
      background: linear-gradient(45deg, var(--neon-yellow), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(230, 0, 18, 0.5);
      animation: titleFloat 3s ease-in-out infinite;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      z-index: 1;
    }

    .game-card {
      border-radius: 20px;
      overflow: hidden;
      width: 300px;
      height: 300px;
      background: linear-gradient(45deg, #2c2c4a 0%, #1a1a2e 100%);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-guide {
      text-align: center;
      font-size: 1.5rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 15px var(--neon-yellow);
      animation: pulseText 2s infinite;
    }

    .holo-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.98);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .holo-content {
      position: relative;
      width: 90%;
      height: 90vh;
      max-width: 1400px;
      background: rgba(26, 26, 46, 0.95);
      border-radius: 30px;
      border: 3px solid var(--main-red);
      box-shadow: 0 0 60px rgba(230, 0, 18, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holo-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--neon-yellow);
      font-size: 2.8rem;
      cursor: pointer;
      z-index: 1001;
    }

    .carrusel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: var(--neon-yellow);
      cursor: pointer;
      padding: 1rem;
      border-radius: 50%;
      z-index: 10;
      transition: background 0.3s;
    }

    .carrusel-btn.left { left: 10px; }
    .carrusel-btn.right { right: 10px; }

    .carrusel-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Carta personalizada */
    .carta {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(26, 26, 46, 0.95);
      border: 3px solid var(--neon-yellow);
      border-radius: 20px;
      padding: 2rem;
      max-width: 80%;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 0 60px rgba(255, 223, 108, 0.4);
      animation: cartaEntrada 0.8s ease-out, cartaSalida 0.8s ease-out 6s forwards;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .carta h2 {
      color: var(--neon-yellow);
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .carta p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .carta button {
      background: var(--main-red);
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .carta button:hover {
      background: #c5000f;
    }

    /* Botón secreto */
    .secreto {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      background: var(--main-red);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 0 20px rgba(230, 0, 18, 0.4);
      transition: transform 0.3s;
    }

    .secreto:hover {
      transform: scale(1.1);
    }

    /* Audio */
    .audio-btn {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 50px;
      height: 50px;
      background: var(--neon-yellow);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 0 20px rgba(255, 223, 108, 0.4);
      transition: transform 0.3s;
    }

    .audio-btn:hover {
      transform: scale(1.1);
    }

    /* Animaciones */
    @keyframes pulseText {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes gridScan {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    @keyframes hologram {
      0% { transform: rotate(0deg) scale(2); }
      100% { transform: rotate(360deg) scale(2); }
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes cartaEntrada {
      0% { opacity: 0; transform: translate(-50%, -40%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }

    @keyframes cartaSalida {
      0% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -60%); }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2.5rem;
      }
      .game-card {
        width: 250px;
        height: 250px;
      }
      .carta {
        max-width: 90%;
        padding: 1.5rem;
      }
      .carta h2 {
        font-size: 1.6rem;
      }
      .carta p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="particles" id="particles"></div>
  
  <header>
    <h1>Nintendo Switch</h1>
  </header>

  <main>
    <section class="game-list">
      <div class="game-guide"><i class="fas fa-mouse-pointer"></i> Haz clic para ver el catálogo</div>
      <div class="game-card" onclick="abrirCatalogo()">
        <img src="catalogo2/nintendo1.png" alt="Vista previa Nintendo" id="previewImg">
      </div>
    </section>
  </main>

  <div class="holo-modal" id="holoModal">
    <div class="holo-content">
      <span class="holo-close" onclick="cerrarCatalogo()">&times;</span>
      <button class="carrusel-btn left" onclick="moverCarrusel(-1)">&#10094;</button>
      <img id="carruselImagen" src="catalogo2/nintendo1.png" alt="Catálogo Nintendo" style="max-height: 90vh; max-width: 100%; border-radius: 20px;">
      <button class="carrusel-btn right" onclick="moverCarrusel(1)">&#10095;</button>
    </div>
  </div>

  <!-- Carta personalizada -->
  <div class="carta" id="carta">
    <h2>¡Bienvenido a Nintendo Cyberverse!</h2>
    <p>
      Gracias por visitar este espacio creado con cariño para ti.<br>
      Aquí encontrarás los mejores juegos, recuerdos y aventuras.<br>
      ¡Que la magia de Nintendo te acompañe en cada partida!
    </p>
    <button onclick="cerrarCarta()">¡A jugar!</button>
  </div>

  <!-- Botón secreto -->
  <div class="secreto" id="secreto">
    <i class="fas fa-star" style="color: #fff;"></i>
  </div>

  <!-- Audio -->
  <div class="audio-btn" id="audioBtn">
    <i class="fas fa-music" style="color: #000;"></i>
  </div>
  <audio id="bgMusic" loop>
    <source src="https://www.myinstants.com/media/sounds/super-mario-bros-theme.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <script>
    // Variables
    const modal = document.getElementById('holoModal');
    const imagenesCatalogo = ["catalogo2/nintendo1.png"];
    let indiceActual = 0;

    // Carta personalizada
    const carta = document.getElementById('carta');
    setTimeout(() => carta.style.display = 'flex', 500);

    function cerrarCarta() {
      carta.style.display = 'none';
    }

    // Carrusel
    function abrirCatalogo() {
      modal.style.display = 'flex';
      document.getElementById("carruselImagen").src = imagenesCatalogo[indiceActual];
    }

    function cerrarCatalogo() {
      modal.style.display = 'none';
    }

    function moverCarrusel(direccion) {
      indiceActual += direccion;
      if (indiceActual < 0) indiceActual = imagenesCatalogo.length - 1;
      if (indiceActual >= imagenesCatalogo.length) indiceActual = 0;
      document.getElementById("carruselImagen").src = imagenesCatalogo[indiceActual];
    }

    // Modal: cerrar al hacer clic fuera
    window.addEventListener('click', e => {
      if (e.target === modal) cerrarCatalogo();
    });

    // Botón secreto
    const secreto = document.getElementById('secreto');
    secreto.addEventListener('click', () => {
      alert("¡Has encontrado el secreto!\n\nGracias por ser parte de esta aventura. Recuerda: la magia está en cada momento que compartes.\n\n¡Sigue jugando y soñando!");
    });

    // Audio
    const audioBtn = document.getElementById('audioBtn');
    const bgMusic = document.getElementById('bgMusic');
    let audioActivo = false;

    audioBtn.addEventListener('click', () => {
      if (audioActivo) {
        bgMusic.pause();
        audioBtn.innerHTML = '<i class="fas fa-music" style="color: #000;"></i>';
      } else {
        bgMusic.play();
        audioBtn.innerHTML = '<i class="fas fa-pause" style="color: #000;"></i>';
      }
      audioActivo = !audioActivo;
    });

    // Efecto de partículas (sin librería)
    function crearParticulas() {
      const particles = document.getElementById('particles');
      particles.innerHTML = '';
      const cantidad = 50;
      for (let i = 0; i < cantidad; i++) {
        const particula = document.createElement('div');
        particula.style.position = 'absolute';
        particula.style.width = Math.random() * 6 + 2 + 'px';
        particula.style.height = particula.style.width;
        particula.style.backgroundColor = 'rgba(255, 223, 108, 0.8)';
        particula.style.borderRadius = '50%';
        particula.style.top = Math.random() * 100 + '%';
        particula.style.left = Math.random() * 100 + '%';
        particula.style.animation = `particulaFlota ${Math.random() * 10 + 10}s linear infinite`;
        particles.appendChild(particula);
      }
    }

    // Añadir animación de partículas al CSS
    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes particulaFlota {
        0%, 100% { transform: translateY(0) translateX(0); opacity: 0.8; }
        50% { transform: translateY(-100px) translateX(50px); opacity: 0.3; }
      }
    `;
    document.head.appendChild(style);

    crearParticulas();
  </script>
</body>
</html>
