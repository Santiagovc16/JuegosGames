<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Nintendo Switch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --nintendo-red: #e60012;
            --nintendo-dark: #0f0c29;
            --accent-yellow: #ffdf6c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #2d2d44);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(to right, var(--nintendo-red), #c00000);
            padding: 3rem 0;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 3.2rem;
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            color: var(--accent-yellow);
            animation: slideDown 0.8s ease-out;
        }

        .game-list {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3rem;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .game-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
            background: linear-gradient(145deg, #2c2c4a, #1a1a2e);
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .game-image-container {
            position: relative;
            width: 100%;
            padding-top: 150%;
            overflow: hidden;
        }

        .game-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s, filter 0.4s;
        }

        .game-card:hover .game-image {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .game-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem 1.5rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover .game-info {
            opacity: 1;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
            color: var(--accent-yellow);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Modal mejorado */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: modalFade 0.3s ease-out;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(230, 0, 18, 0.3);
        }

        .modal-image {
            width: 100%;
            height: 70vh;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            color: var(--accent-yellow);
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--nintendo-red);
        }

        footer {
            background: linear-gradient(to right, var(--nintendo-red), #a00000);
            padding: 2rem 0;
            text-align: center;
            font-size: 1.1rem;
            margin-top: auto;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes modalFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
                padding: 0 1rem;
            }

            .game-list {
                grid-template-columns: 1fr;
                padding: 2rem 1rem;
                gap: 2rem;
            }

            .modal-content {
                max-width: 95%;
            }

            .modal-image {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo Nintendo Switch</h1>
    </header>
    
    <main>
        <section class="game-list">
            <div class="game-card">
                <div class="game-image-container">
                    <img src="images3/juego1.jpg" alt="The Legend of Zelda: Tears of the Kingdom" class="game-image">
                    <div class="game-info">
                        <h3 class="game-title">The Legend of Zelda: Tears of the Kingdom</h3>
                    </div>
                </div>
            </div>
            
            <div class="game-card">
                <div class="game-image-container">
                    <img src="images3/juego2.jpg" alt="Super Mario Odyssey" class="game-image">
                    <div class="game-info">
                        <h3 class="game-title">Super Mario Odyssey</h3>
                    </div>
                </div>
            </div>
            
            <div class="game-card">
                <div class="game-image-container">
                    <img src="images3/juego3.jpg" alt="Animal Crossing: New Horizons" class="game-image">
                    <div class="game-info">
                        <h3 class="game-title">Animal Crossing: New Horizons</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img class="modal-image" src="" alt="Vista ampliada del juego">
        </div>
    </div>

    <footer>
        <p>© 2024 Gamer Edge - Nintendo Switch</p>
    </footer>

    <script>
        // Configuración del modal
        const modal = document.getElementById('imageModal');
        const modalImage = document.querySelector('.modal-image');
        const closeModal = document.querySelector('.modal-close');
        const gameCards = document.querySelectorAll('.game-card');

        // Abrir modal
        gameCards.forEach(card => {
            card.addEventListener('click', () => {
                const imageSrc = card.querySelector('img').src;
                const imageAlt = card.querySelector('img').alt;
                modal.style.display = 'flex';
                modalImage.src = imageSrc;
                modalImage.alt = imageAlt;
            });
        });

        // Cerrar modal
        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Cerrar al hacer clic fuera
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Cerrar con tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
