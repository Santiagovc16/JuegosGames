<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Xbox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #0a0a0a, #1c1c1c); /* Fondo oscuro estilo Xbox */
            color: white;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, #107c10, #3da64c); /* Gradiente verde Xbox */
            color: white;
            text-align: center;
            padding: 2.5rem 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
            border-bottom: 4px solid #0d6c09;
        }

        header h1 {
            font-size: 3.5rem; /* Tamaño ajustado para que destaque más */
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7); /* Sombra para resaltar el título */
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Aumenta el tamaño de los elementos */
            gap: 2rem;
            padding: 3rem;
        }

        .game {
            position: relative;
            overflow: hidden;
            border-radius: 15px; /* Ajuste para esquinas suaves */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); /* Sombra más fuerte */
            transition: transform 0.3s, box-shadow 0.3s;
            background: linear-gradient(to top, #0d6c09, #3da64c); /* Verde Xbox brillante */
        }

        .game:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); /* Resalta al pasar el cursor */
        }

        .game img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            transition: opacity 0.3s, transform 0.3s;
            cursor: pointer;
        }

        .game:hover img {
            opacity: 0.9;
            transform: scale(1.05);
        }

        footer {
            background: linear-gradient(to right, #107c10, #3da64c); /* Gradiente similar al encabezado */
            color: white;
            text-align: center;
            padding: 1.5rem 0;
            font-size: 1rem;
            box-shadow: 0 -6px 12px rgba(0, 0, 0, 0.7);
        }

        footer p {
            margin: 0;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 85%;
            max-height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }

        .close:hover {
            color: #3da64c;
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo de Juegos Xbox</h1>
    </header>
    <main>
        <section class="game-list">
            <div class="game">
                <img src="images2/juego1.jpg" alt="Juego Xbox 1" class="game-img">
            </div>
            
        </section>
    </main>

    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modal-img" src="" alt="Imagen del Juego">
        </div>
    </div>

    <footer>
        <p>Gamer Edges - Xbox</p>
    </footer>

    <script>
        const modal = document.getElementById("myModal");
        const modalImg = document.getElementById("modal-img");
        const closeBtn = document.querySelector(".close");
        const images = document.querySelectorAll(".game-img");

        images.forEach(image => {
            image.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = image.src;
            });
        });

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        window.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>
</body>
</html>
