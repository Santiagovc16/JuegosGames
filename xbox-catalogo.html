<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Cyber Nexus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #0dffc2;
            --cyber-purple: #bd00ff;
            --matrix-green: #00ff4c;
            --bg-dark: #001100;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at 50% 50%, #000, var(--bg-dark));
            color: var(--neon-green);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cyber-grid {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 255, 100, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
            animation: gridScan 8s linear infinite;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
            padding: 4rem 0;
            border-bottom: 3px solid var(--neon-green);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--neon-green), var(--cyber-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonPulse 1.5s infinite alternate;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            padding: 5rem;
            perspective: 2000px;
        }

        .game-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
        }

        .game-card:hover {
            transform: perspective(1000px) rotateX(10deg) rotateY(10deg) translateZ(50px);
        }

        .game-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: transform 0.5s, filter 0.5s;
        }

        .holo-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .holo-content {
            position: relative;
            width: 80%;
            max-width: 1200px;
            background: rgba(0, 17, 0, 0.9);
            border-radius: 15px;
            border: 3px solid var(--neon-green);
            box-shadow: 0 0 50px rgba(0, 255, 100, 0.5);
        }

        @keyframes neonPulse {
            from { text-shadow: 0 0 10px var(--matrix-green); }
            to { text-shadow: 0 0 30px var(--matrix-green); }
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.5rem; }
            .game-list { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    
    <header>
        <h1>Xbox Cyber Nexus</h1>
    </header>

    <main>
        <section class="game-list">
            <!-- Juegos aquí -->
        </section>
    </main>

    <div class="holo-modal" id="holoModal">
        <div class="holo-content">
            <!-- Contenido del modal -->
        </div>
    </div>

    <script>
        // Sistema de partículas dinámicas
        function createParticles() {
            const container = document.createElement('div');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: fixed;
                    width: 2px;
                    height: 2px;
                    background: ${Math.random() > 0.5 ? 'var(--neon-green)' : 'var(--cyber-purple)'};
                    border-radius: 50%;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation: float ${5 + Math.random() * 10}s infinite;
                `;
                container.appendChild(particle);
            }
            document.body.appendChild(container);
        }
        createParticles();

        // Control del Modal
        const modal = document.getElementById('holoModal');
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', () => modal.style.display = 'flex');
        });
    </script>
</body>
</html>
