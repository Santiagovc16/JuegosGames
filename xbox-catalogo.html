<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox Series</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --neon-green: #0dffc2;
      --cyber-purple: #bd00ff;
      --matrix-green: #00ff4c;
      --bg-dark: #000a00;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #000, var(--bg-dark));
      color: var(--neon-green);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .cyber-grid {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 255, 100, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 100, 0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
      animation: gridScan 8s linear infinite;
    }

    header {
      text-align: center;
      padding: 4rem 0;
      border-bottom: 2px solid var(--neon-green);
      backdrop-filter: blur(6px);
      background: rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 2;
    }

    header h1 {
      font-size: 4rem;
      margin: 0;
      background: linear-gradient(45deg, var(--neon-green), var(--cyber-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--matrix-green);
      animation: neonPulse 1.5s infinite alternate;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      text-align: center;
    }

    .guide-text {
      font-size: 1.5rem;
      color: var(--neon-green);
      margin-bottom: 1.5rem;
      text-shadow: 0 0 10px var(--neon-green);
      animation: pulseText 2s infinite;
    }

    .game-card {
      width: 300px;
      height: 300px;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      background: #000;
      box-shadow: 0 0 30px rgba(0, 255, 100, 0.3);
      border: 2px solid rgba(0, 255, 100, 0.2);
      transition: transform 0.4s ease-in-out;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .holo-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .holo-content {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 90vh;
      background: rgba(0, 17, 0, 0.9);
      border-radius: 15px;
      border: 3px solid var(--neon-green);
      box-shadow: 0 0 50px rgba(0, 255, 100, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carrusel-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carrusel-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 100, 0.3);
    }

    .carrusel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: var(--neon-green);
      cursor: pointer;
      padding: 1rem;
      border-radius: 50%;
      z-index: 10;
      transition: background 0.3s;
    }

    .carrusel-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carrusel-btn.left { left: 10px; }
    .carrusel-btn.right { right: 10px; }

    footer {
      text-align: center;
      padding: 3rem 1rem;
      margin-top: 4rem;
      color: var(--neon-green);
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.6);
      border-top: 2px solid var(--neon-green);
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @keyframes neonPulse {
      from { text-shadow: 0 0 10px var(--matrix-green); }
      to { text-shadow: 0 0 30px var(--matrix-green); }
    }

    @keyframes gridScan {
      0% { background-position: 0 0; }
      100% { background-position: 30px 30px; }
    }

    @media (max-width: 768px) {
      header h1 { font-size: 2.5rem; }
      .game-card { width: 90vw; height: 90vw; }
    }
    .xbox-controls {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      gap: 1rem;
      z-index: 1001;
    }

    .xbox-controls button {
      background: rgba(0, 255, 100, 0.1);
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      padding: 1rem;
      font-size: 1.5rem;
      color: var(--neon-green);
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 255, 100, 0.3);
      transition: transform 0.3s, background 0.3s;
    }

    .xbox-controls button:hover {
      background: rgba(0, 255, 100, 0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>

  <audio id="bgMusic" loop>
    <source src="assets/audio/halo2-theme.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <header>
    <h1>Xbox Series X </h1>
  </header>

  <main>
    <div class="guide-text">
      <i class="fas fa-mouse-pointer"></i> Presiona clic para ver catálogo
    </div>
    <div class="game-card" onclick="abrirCatalogo()">
      <img src="catalogo2/Diapositiva1.png" alt="Vista previa catálogo Xbox">
    </div>
  </main>
  <div class="xbox-controls">
    <button class="audio-btn" id="audioBtn">
      <i class="fas fa-music"></i>
    </button>
    <button class="star-btn">
      <i class="fas fa-star"></i>
    </button>
  </div>

  <div class="holo-modal" id="holoModal">
    <div class="holo-content">
      <div class="carrusel-container">
        <button class="carrusel-btn left" onclick="moverCarrusel(-1)">&#10094;</button>
        <img id="carruselImagen" src="catalogo2/Diapositiva1.png" alt="Catálogo Xbox">
        <button class="carrusel-btn right" onclick="moverCarrusel(1)">&#10095;</button>
      </div>
    </div>
  </div>

  <footer>
    Xbox® Cyberverse - El futuro del juego está aquí
  </footer>

  <script>
    let bgMusic;
    let audioActivo = false;

    window.addEventListener('DOMContentLoaded', () => {
      bgMusic = document.getElementById('bgMusic');
      // Iniciar la música al tocar cualquier parte del cuerpo del documento
      document.body.addEventListener('pointerdown', iniciarMusica, { once: true });
    });

    const modal = document.getElementById('holoModal');
    const imagenesCatalogo = [
      "catalogo2/Diapositiva1.png",
      "catalogo2/Diapositiva2.png",
      "catalogo2/Diapositiva3.png",
      "catalogo2/Diapositiva4.png",
      "catalogo2/Diapositiva5.png"
    ];
    let indiceActual = 0;

    function iniciarMusica() {
      console.log("Intentando reproducir música...");
      if (!audioActivo) {
        bgMusic.volume = 0.4;
        bgMusic.play().catch(e => console.warn("Reproducción bloqueada:", e));
        audioActivo = true;
      }
    }

    function abrirCatalogo() {
      modal.style.display = 'flex';
      document.getElementById("carruselImagen").src = imagenesCatalogo[indiceActual];
    }

    function moverCarrusel(direccion) {
      indiceActual += direccion;
      if (indiceActual < 0) indiceActual = imagenesCatalogo.length - 1;
      if (indiceActual >= imagenesCatalogo.length) indiceActual = 0;
      document.getElementById("carruselImagen").src = imagenesCatalogo[indiceActual];
    }

    window.addEventListener('click', e => {
      if (e.target === modal) modal.style.display = 'none';
    });

    const audioBtn = document.getElementById('audioBtn');
    audioBtn.addEventListener('click', () => {
      if (audioActivo) {
        bgMusic.pause();
        audioBtn.innerHTML = '<i class="fas fa-music"></i>';
      } else {
        bgMusic.play();
        audioBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }
      audioActivo = !audioActivo;
    });
  </script>

</body>
</html>
